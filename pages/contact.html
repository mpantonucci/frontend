<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Menu</title>
</head>

<body>

    <section>
        <div class="container">
            <div>

                <!-- Button trigger modal -->
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
                    Launch demo modal
                </button>

                <!-- Modal -->
                <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                ...
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="button" class="btn btn-primary">Save changes</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>


            <!-- <button class="btn btn-primary">Voltar</button> -->
            <h1>Contact</h1>
            <form action="" method="POST">
                <div class="mb-3">
                    <label for="nome" class="form-control">Name:</label>
                    <input class="form-control" type="text" id="nome" name="nome" size="30"
                        placeholder="Digite o seu nome" required>
                </div>

                <div>
                    <label for="email" class="form-control">Email:</label>
                    <input class="form-control" type="email" id="email" name="email">
                </div>

                <div>

                    <label for="estado" class="form-control">Estado:</label>
                    <select class="form-control" name="estado" id="estado">
                        <option value="">Selecione um estado</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                    </select>

                </div>


                <div>
                    <label for="mensagem" class="form-control">Mensagem:</label>
                    <textarea class="form-control" id="mensagem" name="mensagem" rows="5" cols="30"
                        placeholder="Digite a sua mensagem"></textarea>
                </div>

                <div class="mb-3 row">
                    <div class="col-3"><button class="btn btn-primary" type="submit">Enviar Formulário</button>
                    </div>
                    <div class="col-3"><button class="btn btn-secondary" type="reset">Limpar Formulário</button></div>
                </div>
            </form>

            <iframe class=""
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3656.123456789!2d-46.633308!3d-23.55052!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59c0c0c0c0c0%3A0x123456789abcdef!2sSão%20Paulo%2C%20SP%2C%20Brazil!5e0!3m2!1sen!2sus!4v1616161616161"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </section>


</body>

</html>
