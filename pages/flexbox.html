<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style type="text/css">
        *{
            padding: 0;
            margin: 0;
            /* box-sizing: border-box; */
        }
        .box {
            display: flex;
            background-color: red;
            flex-wrap:wrap;
            width: 100%;
            height: 500px;
            align-content: flex-start;
            flex-direction: reverse;
            gap: 10px;
        }
        div[class^=c]  {
            background-color: #6600ff;
            width: 200px;
            height: 100px;
            color: white;
            text-align: center;
            flex-shrink: 0;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /*Trabalhando com Media Queries*/
        /*maior ou igual a 700px*/
        @media screen and (min-width: 700px) {
            .media {
                background-color: red;
                color: white;
                font-size: 30px;
            }
        }

    </style>
</head>
<body>
    <!--Trabalhando com Media Queries-->
    <div class="media">Lorem ipsum dolor sit amet consectetur adipisicing elit. Molestias, distinctio.</div>

</html>
